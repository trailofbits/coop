name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # coop-proxy's aws-lc-sys crypto backend (issue #411) needs cmake; the
      # `--workspace` clippy/test below build it. Preinstalled on ubuntu-latest,
      # installed explicitly so the job doesn't depend on the image contents.
      - name: Install cmake
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Format check
        run: cargo fmt -- --check

      # `--workspace` so coop-proxy is linted/tested too (it is not a default
      # member, to keep plain `cargo build` and the integration scripts light).
      # No `--all-features`: the only feature, `apple-container`, is macOS-only
      # and is a deliberate compile error here (checked below, and linted in
      # the `apple-container` job).
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

      - name: apple-container feature is rejected off macOS
        run: |
          if cargo check --features apple-container 2> apple-feature.log; then
            echo "apple-container unexpectedly built on Linux" >&2
            exit 1
          fi
          grep -q "exists only on" apple-feature.log

      - name: Install network test tools
        run: sudo apt-get update && sudo apt-get install -y iproute2 iptables iputils-ping util-linux openssh-client openssh-server

      - name: Release preflight regression tests
        run: python3 tests/test-preflight-release.py

      - name: Integration probe regression tests
        run: python3 tests/test-integration-probes.py

      - name: Codex account wrapper regression tests
        run: python3 tests/test-codex-account.py

      - name: Integration test — proxy reverse forwarding
        run: ./tests/integration-proxy-forward.sh

      - name: Integration test — bridge isolation
        run: ./tests/integration-network.sh

      - name: Integration test — installer provenance
        run: ./tests/integration-install.sh

      - name: Integration test — coop update
        run: ./tests/integration-update.sh

      - name: Integration test — coop uninstall
        run: ./tests/integration-uninstall.sh

  # The opt-in Apple sandbox backend compiles only on macOS. Unit tests use a
  # scripted runtime, and the coop-sandbox tests boot no VM; nothing here needs
  # Apple Container or virtualization. The default (Lima) build is checked here
  # too, since shared backend, SSH, and lifecycle code compiles differently on
  # macOS than on the Linux jobs.
  apple-container:
    # Pinned: macos/coop-sandbox needs Swift 6.2+ and the macOS 26 SDK
    # (vmnet networks); this image's default Xcode is 26.x.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Clippy (macOS default / Lima)
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests (macOS default / Lima)
        run: cargo test

      - name: Clippy (apple-container)
        run: cargo clippy --all-targets --features apple-container -- -D warnings

      - name: Unit tests (apple-container)
        run: cargo test --features apple-container

      - name: coop-sandbox build and unit tests
        run: |
          swift --version
          swift test --package-path macos/coop-sandbox --force-resolved-versions --no-parallel

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # v1.23.0

      # Pin to match CARGO_DENY_VERSION in scripts/install-dev-tools.sh so CI and
      # local installs run the same version.
      - name: Install cargo-deny
        run: cargo binstall --no-confirm cargo-deny@0.19.9

      # `--workspace` roots the crate graph at every workspace member. With a
      # root package present, cargo-deny otherwise checks only `coop`, missing
      # `coop-proxy`'s async/HTTP/TLS supply chain (issue #411).
      - name: Check advisories, licenses, bans, sources
        run: cargo deny --workspace check

  taplo:
    runs-on: ubuntu-latest
    # Single version knob for this job; keep in sync with TAPLO_VERSION in
    # scripts/install-dev-tools.sh. Used for both the cache key and the install,
    # so the two can never drift (a bumped install with a stale key would
    # silently keep checking with the cached old binary).
    env:
      TAPLO_VERSION: 0.10.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # taplo has no cargo-binstall prebuilts, so compile from crates.io
      # (checksum-verified source) and cache the binary keyed on the pinned
      # version — only the first run or a version bump pays the compile cost.
      - name: Cache taplo
        id: cache-taplo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/taplo
          key: ${{ runner.os }}-taplo-cli-${{ env.TAPLO_VERSION }}

      - name: Install taplo
        if: steps.cache-taplo.outputs.cache-hit != 'true'
        run: cargo install taplo-cli --version "=${TAPLO_VERSION}" --locked

      - name: Check TOML formatting
        run: taplo format --check

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
