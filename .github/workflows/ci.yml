name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # coop-proxy's aws-lc-sys crypto backend (issue #411) needs cmake; the
      # `--workspace` clippy/test below build it. The musl compile catches
      # target-specific libc API differences before the release workflow.
      - name: Install cmake, musl tools, and zsh
        run: sudo apt-get update && sudo apt-get install -y cmake musl-tools zsh

      - name: Check musl portability
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo check --target x86_64-unknown-linux-musl

      - name: Format check
        run: cargo fmt -- --check

      # `--workspace` so coop-proxy is linted/tested too (it is not a default
      # member, to keep plain `cargo build` and the integration scripts light).
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

      - name: Install integration test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables iputils-ping jq rsync util-linux \
            openssh-client openssh-server

      - name: Guest-file copy regression tests
        run: bash tests/guest-files-copy.sh

      - name: Release preflight regression tests
        run: python3 tests/test-preflight-release.py

      - name: Integration probe regression tests
        run: python3 tests/test-integration-probes.py

      - name: Codex account wrapper regression tests
        run: python3 tests/test-codex-account.py

      - name: Linux unit runner regression tests
        run: python3 tests/test-linux-unit-runner.py

      - name: Integration test — proxy reverse forwarding
        run: ./tests/integration-proxy-forward.sh

      - name: Integration test — bridge isolation
        run: ./tests/integration-network.sh

      - name: Integration test — installer provenance
        run: ./tests/integration-install.sh

      - name: Integration test — coop update
        run: ./tests/integration-update.sh

      - name: Integration test — coop uninstall
        run: ./tests/integration-uninstall.sh

  kani:
    runs-on: ubuntu-latest
    # Keep in sync with KANI_VERSION in scripts/install-dev-tools.sh.
    env:
      KANI_VERSION: 0.67.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Kani setup installs its own pinned nightly Rust toolchain. Cache both
      # that toolchain and the verifier so subsequent runs only check proofs.
      - name: Cache Kani toolchain
        id: cache-kani
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
            ~/.kani
            ~/.rustup/toolchains/nightly-*
          key: ${{ runner.os }}-${{ runner.arch }}-kani-${{ env.KANI_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Install Kani
        if: steps.cache-kani.outputs.cache-hit != 'true'
        run: cargo install kani-verifier --version "=${KANI_VERSION}" --locked

      - name: Set up Kani
        if: steps.cache-kani.outputs.cache-hit != 'true'
        run: cargo kani setup

      - name: Verify all proofs
        run: cargo kani --output-format terse

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@8a2045612414e945291083f820cd50b4d8fc2218 # v1.26.0

      # Pin to match CARGO_DENY_VERSION in scripts/install-dev-tools.sh so CI and
      # local installs run the same version.
      - name: Install cargo-deny
        run: cargo binstall --no-confirm cargo-deny@0.19.9

      # `--workspace` roots the crate graph at every workspace member. With a
      # root package present, cargo-deny otherwise checks only `coop`, missing
      # `coop-proxy`'s async/HTTP/TLS supply chain (issue #411).
      - name: Check advisories, licenses, bans, sources
        run: cargo deny --workspace check

  taplo:
    runs-on: ubuntu-latest
    # Single version knob for this job; keep in sync with TAPLO_VERSION in
    # scripts/install-dev-tools.sh. Used for both the cache key and the install,
    # so the two can never drift (a bumped install with a stale key would
    # silently keep checking with the cached old binary).
    env:
      TAPLO_VERSION: 0.10.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # taplo has no cargo-binstall prebuilts, so compile from crates.io
      # (checksum-verified source) and cache the binary keyed on the pinned
      # version — only the first run or a version bump pays the compile cost.
      - name: Cache taplo
        id: cache-taplo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/taplo
          key: ${{ runner.os }}-taplo-cli-${{ env.TAPLO_VERSION }}

      - name: Install taplo
        if: steps.cache-taplo.outputs.cache-hit != 'true'
        run: cargo install taplo-cli --version "=${TAPLO_VERSION}" --locked

      - name: Check TOML formatting
        run: taplo format --check

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
