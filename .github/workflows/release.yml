name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

env:
  CARGO_TERM_COLOR: always
  BINARY: coop

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          # Native ARM64 Linux runner — no cross-compilation, so coop-proxy's
          # aws-lc-sys builds with the native musl toolchain (issue #411).
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Each target builds on a matching-arch runner (no cross-compilation).
      # The Linux musl legs need musl-gcc + cmake to build coop-proxy's
      # aws-lc-sys crypto backend natively; macOS ships cmake preinstalled.
      - name: Install musl tools and cmake (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools cmake

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        # `--workspace` builds both `coop` and `coop-proxy` from one source
        # tree, so they ship in lockstep (issue #411). Native builds: musl-gcc
        # is the C compiler (for aws-lc-sys) and the linker on each Linux
        # runner. The macOS leg ignores these vars.
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          name="${BINARY}-${tag}-${{ matrix.target }}"
          mkdir -p "staging/${name}"
          cp "target/${{ matrix.target }}/release/${BINARY}" "staging/${name}/"
          # coop-proxy rides in the same tarball, inheriting the identical
          # SLSA build-provenance attestation with no new machinery.
          cp "target/${{ matrix.target }}/release/${BINARY}-proxy" "staging/${name}/"
          cp LICENSE* staging/${name}/ 2>/dev/null || true
          tar -czf "${name}.tar.gz" -C staging "${name}"
          echo "TARBALL=${name}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: ${{ env.TARBALL }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum coop-*.tar.gz > SHA256SUMS

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "coop-*.tar.gz"

      # The asset name is load-bearing: `gh attestation verify --bundle`
      # dispatches on the file extension and rejects anything that is not
      # `.json`/`.jsonl`, so renaming this output breaks verification for every
      # client. `bundle-path` is a single JSON line covering all three tarball
      # subjects, so `jq -c` reshapes nothing — it is here to reject a malformed
      # bundle, and the `-s` test to reject an empty one, which `jq` itself
      # exits 0 on.
      #
      # An empty asset is caught client-side too (`install.sh` gates on `[ -s ]`
      # and `resolve_provenance` returns `ApiReason::EmptyBundle`, both falling
      # back to the API). What no client catches is a *non-empty* degenerate
      # bundle: a whitespace-only file passes `[ -s ]` and `len() > 0` alike,
      # and `gh`'s JSON-Lines loader then yields zero attestations — which `gh`
      # before 2.56.0 (cli/cli#9541) reports as success, having verified
      # nothing. `jq -c .` is what makes that unreachable, so it has to stay
      # upstream of publication; the tag is immutable once cut.
      - name: Normalize attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          jq -c . "$BUNDLE_PATH" > attestations.jsonl
          if [ ! -s attestations.jsonl ]; then
            echo "Attestation bundle at $BUNDLE_PATH produced no output" >&2
            exit 1
          fi

      - name: Extract release notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="## $TAG" '
            $0 == tag { found=1; next }
            found && /^## / { exit }
            found
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG entry found for $TAG" >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md coop-*.tar.gz SHA256SUMS attestations.jsonl
