name: Firecracker integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firecracker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  integration:
    name: Full integration (Linux x64 / KVM)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y acl build-essential cmake curl e2fsprogs \
            iproute2 iptables iputils-ping jq openssh-client openssh-server \
            pkg-config python3 rsync squashfs-tools util-linux zsh

      - name: Verify hardware virtualization
        run: |
          test "$(uname -m)" = x86_64
          test -c /dev/kvm
          test -c /dev/net/tun
          sudo -n setfacl -m "u:$(id -un):rw" /dev/kvm
          python3 - <<'PY'
          import fcntl
          import os

          with open("/dev/kvm", "r+b", buffering=0) as kvm:
              version = fcntl.ioctl(kvm, 0xAE00, 0)  # KVM_GET_API_VERSION
              if version != 12:
                  raise SystemExit(f"Unsupported KVM API version: {version}")
              vm = fcntl.ioctl(kvm, 0xAE01, 0)  # KVM_CREATE_VM
              os.close(vm)
          print("KVM VM creation succeeded")
          PY

      # Image rebuilds and copies need more disk than the standard runner's
      # advertised free space. These SDKs are unused by the Linux VM suite.
      - name: Make room for VM images
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
          free -h

      - name: Full Firecracker integration
        timeout-minutes: 80
        env:
          # Safe only on this disposable runner: exercises destroy --all.
          COOP_TEST_DESTRUCTIVE: "1"
        run: |
          set -o pipefail
          ./tests/run-integration.sh --full --require-proxy 2>&1 \
            | tee "$RUNNER_TEMP/firecracker-integration.log"

      - name: Upload integration output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firecracker-integration-log
          path: ${{ runner.temp }}/firecracker-integration.log
          if-no-files-found: ignore
          retention-days: 7
