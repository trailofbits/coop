name: Firecracker integration

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firecracker-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  integration:
    name: Full integration (${{ matrix.shard }} / ${{ matrix.os }} / KVM)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [lifecycle, workspace, config, features]
        os: [ubuntu-24.04, ubuntu-26.04]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y acl build-essential cmake curl e2fsprogs \
            iproute2 iptables iputils-ping jq openssh-client openssh-server \
            pkg-config python3 rsync squashfs-tools util-linux zsh

      # Image rebuilds and copies need more disk than the standard runner's
      # advertised free space. These SDKs are unused by the Linux VM suite.
      - name: Make room for VM images
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
          free -h

      - name: Full Firecracker integration
        timeout-minutes: 30
        env:
          # Safe only on this disposable runner: exercises destroy --all.
          COOP_TEST_DESTRUCTIVE: "1"
          # Regular CI runs this host-only gate; do not repeat it in each shard.
          COOP_TEST_SKIP_BRIDGE: "1"
          SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          args=(--full --shard "$SHARD")
          if [[ "$SHARD" == config ]]; then
            args+=(--require-proxy)
          fi
          ./tests/run-integration.sh "${args[@]}" 2>&1 \
            | tee "$RUNNER_TEMP/firecracker-integration.log"

      - name: Upload integration output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firecracker-integration-${{ matrix.os }}-${{ matrix.shard }}-log
          path: ${{ runner.temp }}/firecracker-integration.log
          if-no-files-found: ignore
          retention-days: 7
