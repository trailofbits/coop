[advisories]
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "MPL-2.0", "Unicode-3.0", "ISC"]
confidence-threshold = 0.8

# Crate-scoped license exceptions keep the global allowlist tight: these
# licenses appear only in the credential-proxy's TLS stack (issue #411), so
# they are permitted for exactly the crates that carry them.
[[licenses.exceptions]]
# FIPS-capable crypto backend for rustls (the recommended provider).
crate = "aws-lc-sys"
allow = ["BSD-3-Clause"]

[[licenses.exceptions]]
# Pinned Mozilla root set compiled into coop-proxy (a data license).
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[[licenses.exceptions]]
# Constant-time primitives used by the rustls/aws-lc-rs crypto stack.
crate = "subtle"
allow = ["BSD-3-Clause"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Keep the OpenSSL / system-TLS path out of the graph so nothing silently
# pulls it in behind the rustls + aws-lc-rs stack.
deny = [
  { crate = "openssl" },
  { crate = "openssl-sys" },
  { crate = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
