[workspace]
members = ["coop-proxy"]
# No `default-members`: with a root package present, plain `cargo build` /
# `cargo test` build only `coop`, so the integration scripts and everyday dev
# builds don't pull in coop-proxy's aws-lc-sys (and its cmake requirement).
# coop-proxy is reached explicitly via `--workspace` — CI clippy/test, the
# release build, and `cargo deny --workspace` all pass it.
# `fuzz/` is its own detached workspace (cargo-fuzz), kept out of this one.
exclude = ["fuzz"]

[workspace.package]
version = "0.5.4"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/trailofbits/coop"

[package]
name = "coop"
version.workspace = true
edition.workspace = true
description = "Isolated VM environment for running Claude Code"
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
dirs = "6.0.0"
indexmap = "2"
libc = "0.2.186"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.1.2"
tracing = "0.1"
semver = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4.3"
mutants = "0.0.4"
# Already in the tree via `url`; taken as a direct dependency so the Zed URL
# builder can escape guest paths against an explicit set rather than hand-roll
# percent-encoding.
percent-encoding = "2"
url = { version = "2", features = ["serde"] }

[dev-dependencies]
proptest = "1.11.0"

[lints]
workspace = true

# Shared across every workspace member (coop + coop-proxy) so the strict
# clippy/rustc policy is declared once.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
# coop is an application; src/lib.rs exists only so in-repo fuzz targets and
# integration tests can import internals (e.g. coop::config::CoopConfig). The
# pub modules are not a curated public API, so the public-API documentation and
# ergonomics lints are noise here.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.lints.rust]
# `cfg(kani)` is set by `cargo kani` (the bounded-proof toolchain), never by a
# normal build. Register it so the `proofs` module doesn't trip unexpected-cfgs.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
