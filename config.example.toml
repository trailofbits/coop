# coop configuration
# Copy to ~/.coop/config.toml and uncomment fields to override defaults.
# An empty file (or no file at all) gives you sensible defaults.
# Run `coop validate` to check your config.

# data_dir = "~/.coop"          # VM artifacts: images, instances, keys
# ssh_port = 22                 # Guest SSH port
# firecracker_bin = "~/.coop/firecracker"  # Linux only
# GitHub auth strategy. Pick ONE of the two forms below — `github` cannot
# be both a string and a table at the same time.
#
# Form A — simple string:
# github = "auto"               # "auto", "env", "off", or "pat"
#
# Form B — table, required when you want per-repo PAT entries.
# Run `coop github setup-pat --repo owner/name` to populate it via wizard.
# Form B `mode = "pat"` is equivalent to form A `github = "pat"`.
#
# [github]
# mode = "pat"
# skip = ["owner/big-repo"]       # repos to skip the auto-prompt for
#
# [github.pat."trailofbits/coop"]
# token = "cmd:security find-generic-password -s coop-github-pat -a trailofbits-coop -w"

# [setup]
# prompt_for_pat = true           # auto-prompt to set up a PAT at `coop start`

# [vm]
# vcpu_count = 2                # vCPUs per VM (override: --vcpus)
# mem_size_mib = 4096           # Memory in MiB (override: --mem)
# template_size_gib = 8         # Template disk in GiB (override: --template-size)
# kernel_path = "~/.coop/vmlinux"          # Linux/Firecracker only
# boot_args = "console=ttyS0 reboot=k panic=1 pci=off root=/dev/vda rw"

# [network]                     # Linux/Firecracker only
# host_ip = "172.16.0.1"
# subnet_mask = "/24"
# host_iface = "auto"           # "auto" detects at runtime

# [guest_env]                   # Literal env vars to set in the guest.
#                               # Overrides forwarded values on key
#                               # collision (warning logged). Avoid for
#                               # secrets — use `env_forward` instead.
# RUST_LOG = "info"
# MY_FLAG = "1"

# [claude]
# config_dir = "~/.claude"  # path to copy CLAUDE.md, rules/, commands/ from (false to disable)
# env_forward = ["CUSTOM_TOKEN"]  # Extra env vars to forward to guest
# marketplaces = ["https://github.com/anthropics/claude-plugins-official"]
# plugins = ["rust-analyzer-lsp@claude-plugins-official"]
#
# Secrets: any field below that holds a secret accepts a "cmd:" prefix.
# The remainder is run via `sh -c` at VM start time and its trimmed
# stdout is used as the value. Examples for api_key:
#   api_key = "cmd:op read op://Private/Anthropic/credential"  # 1Password
#   api_key = "cmd:security find-generic-password -s anthropic -w"  # macOS Keychain
#   api_key = "cmd:pass show anthropic/api-key"  # pass
#   api_key = "sk-ant-..."  # Plain value also works

# [claude.mcp_servers.my-server]
# command = "/usr/bin/my-mcp-server"
# args = ["--verbose"]
# env = { API_KEY = "MY_HOST_ENV_VAR" }
# # Header values also accept the "cmd:" prefix:
# # headers = { Authorization = "cmd:op read op://Private/Sentry/token" }

# [claude.local_model]              # Route Claude Code at a host-side model.
#                                   # Enable per VM with `coop model <vm> local`
#                                   # (disable with `coop model <vm> remote`).
#                                   # host_url is as seen on the *host*; a
#                                   # localhost host is rewritten to the guest's
#                                   # view of the host automatically.
# host_url = "http://localhost:11434"  # Must serve the Anthropic Messages API
#                                      # (vLLM / LM Studio native; Ollama needs a
#                                      # proxy). Prompt caching is lost locally.
# model = "qwen2.5-coder:32b"
# auth_token = "sk-..."             # Optional; permissive servers ignore it.

# [codex]
# auth = "api_key"  # "api_key" (default) or "chatgpt" for ChatGPT account/workspace auth
# config_dir = "~/.codex"  # path to copy AGENTS.md, prompts/, config.toml, auth.json from (false to disable)
# auth = "chatgpt" stores Codex credentials in the guest Linux keyring and
# does not copy auth.json or forward OPENAI_API_KEY.
# env_forward = ["CUSTOM_TOKEN"]  # Extra env vars to forward to guest
# marketplaces = ["trailofbits/codex-plugins"]  # owner/repo, git URL, or local path
# plugins = ["my-lsp@codex-plugins"]  # plugin@marketplace to install
#
# Secrets: with auth = "api_key", `api_key` accepts the same "cmd:" prefix as
# `claude.api_key`.
#   api_key = "cmd:op read op://Private/OpenAI/credential"
#   api_key = "sk-proj-..."

# [codex.mcp_servers.my-server]
# command = "npx"
# args = ["-y", "@openai/some-mcp-server"]
# env = { API_KEY = "MY_HOST_ENV_VAR" }

# [codex.local_model]               # Route Codex at a host-side model.
#                                   # Toggled per VM with `coop model <vm>
#                                   # local|remote`, same as claude.local_model.
# host_url = "http://localhost:11434/v1/"  # Must serve the Responses API
#                                          # (Ollama / vLLM / LM Studio; ~64K
#                                          # context floor).
# model = "gpt-oss:120b"
# auth_token = "sk-..."             # Optional; permissive servers ignore it.

# [proxy]                           # Host-side credential-injecting proxy
#                                   # (issue #411). Opt-in: when set, coop runs
#                                   # a `coop-proxy` process on the host and the
#                                   # raw credential never enters the guest —
#                                   # the guest is pointed at the proxy and gets
#                                   # only a per-instance capability token, and
#                                   # the raw API key is no longer forwarded.
#                                   # Applies only in remote model mode
#                                   # (`coop model <vm> remote`); local mode
#                                   # takes precedence. Works on both backends.
# `coop proxy setup [--openai] [--vm <name>]` writes this for you: it takes a
# pasted credential, stores it in Keychain / 1Password / a 0600 file, and fills
# in the `cmd:` reference. Anthropic covers Claude Code; openai covers Codex.
# A `--vm <name>` override is stored in that VM's instance state (not here);
# `coop proxy status` shows what each VM resolves to (override → default → off).
# [proxy.anthropic]
# credential = "cmd:op read op://Private/Anthropic/credential"  # same "cmd:" support
# auth = "api_key"                  # api_key → x-api-key (default); bearer →
#                                   # Authorization: Bearer, for a Claude
#                                   # `setup-token` (run `claude setup-token`).
# [proxy.openai]                    # Codex. OpenAI keys are always Bearer.
# credential = "cmd:op read op://Private/OpenAI/credential"
# auth = "bearer"                   # OpenAI keys inject as Authorization: Bearer.
#                                   # Cannot be combined with
#                                   # [codex] auth = "chatgpt"; proxy mode uses
#                                   # an API key.

# [profiles.my-tools]
# apt_packages = ["ripgrep", "fd-find", "jq"]
# pre_install = "curl -fsSL https://example.com/setup.sh | bash"
# post_install = "echo 'done'"

# [updates]
# mode = "notify"                # off | notify (default: notify)
# check_interval_hours = 24      # minimum age before background re-check
